<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Redirect from 404 to index.html for SPA routing
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="__UMAMI_WEBSITE_ID__" data-do-not-track="true" data-performance="true" data-exclude-hash="true" data-domains="parris-tech-services.github.io" data-tag="DCSCompanion"></script>
  </head>
  <body>
  </body>
</html>
